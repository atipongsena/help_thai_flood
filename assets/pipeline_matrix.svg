<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">24 Experimental NLP Pipelines Architecture Matrix</text>
  <text x="475" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">6 Text Preprocessing Pipelines × 4 Feature Representation / Embedding Models</text>

  <!-- Table Header -->
  <g transform="translate(40, 90)">
    <!-- Column Headers -->
    <rect x="0" y="0" width="310" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="155" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Preprocessing Pipeline</text>

    <rect x="320" y="0" width="130" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="385" y="21" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Bag-of-Words</text>
    <text x="385" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">(Naive Bayes)</text>

    <rect x="460" y="0" width="130" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="525" y="21" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">TF-IDF</text>
    <text x="525" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">(SVM / LogReg)</text>

    <rect x="600" y="0" width="130" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="665" y="21" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Word2Vec</text>
    <text x="665" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">(Dense SVM)</text>

    <rect x="740" y="0" width="130" height="42" rx="8" fill="#6b21a8" fill-opacity="0.5" stroke="#a855f7"/>
    <text x="805" y="21" fill="#d8b4fe" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">WangchanBERTa</text>
    <text x="805" y="34" fill="#c084fc" font-family="sans-serif" font-size="9" text-anchor="middle">(Fine-tuned SOTA)</text>
  </g>

  <!-- Row 1: Pipeline 1 -->
  <g transform="translate(40, 142)">
    <rect x="0" y="0" width="310" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="15" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">P1: Raw Text</text>
    <text x="15" y="38" fill="#64748b" font-family="sans-serif" font-size="9">No cleaning, tokenization only</text>

    <rect x="320" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="385" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9913</text>
    <text x="385" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.29%</text>

    <rect x="460" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="525" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9924</text>
    <text x="525" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.50%</text>

    <rect x="600" y="0" width="130" height="48" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981"/>
    <text x="665" y="24" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">F1: 0.9927 ⭐</text>
    <text x="665" y="38" fill="#10b981" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.55%</text>

    <rect x="740" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="805" y="24" fill="#c084fc" font-family="sans-serif" font-size="10" text-anchor="middle">Tested</text>
    <text x="805" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Contextual</text>
  </g>

  <!-- Row 2: Pipeline 2 -->
  <g transform="translate(40, 198)">
    <rect x="0" y="0" width="310" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="15" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">P2: Clean</text>
    <text x="15" y="38" fill="#64748b" font-family="sans-serif" font-size="9">Remove URL, hashtag, trailing spaces</text>

    <rect x="320" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="385" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9914</text>
    <text x="385" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.31%</text>

    <rect x="460" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="525" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9924</text>
    <text x="525" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.50%</text>

    <rect x="600" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="665" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9923</text>
    <text x="665" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.48%</text>

    <rect x="740" y="0" width="130" height="48" rx="6" fill="#4c1d95" fill-opacity="0.3" stroke="#a855f7"/>
    <text x="805" y="24" fill="#d8b4fe" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Optimal Prep</text>
    <text x="805" y="38" fill="#a855f7" font-family="sans-serif" font-size="9" text-anchor="middle">Preserves syntax</text>
  </g>

  <!-- Row 3: Pipeline 3 -->
  <g transform="translate(40, 254)">
    <rect x="0" y="0" width="310" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="15" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">P3: Clean + Normalize</text>
    <text x="15" y="38" fill="#64748b" font-family="sans-serif" font-size="9">Thai numerals to Arabic, spelling normalize</text>

    <rect x="320" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="385" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9884</text>
    <text x="385" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 97.72%</text>

    <rect x="460" y="0" width="130" height="48" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981"/>
    <text x="525" y="24" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">F1: 0.9927 ⭐</text>
    <text x="525" y="38" fill="#10b981" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.55%</text>

    <rect x="600" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="665" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9924</text>
    <text x="665" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.50%</text>

    <rect x="740" y="0" width="130" height="48" rx="6" fill="#4c1d95" fill-opacity="0.3" stroke="#a855f7"/>
    <text x="805" y="24" fill="#d8b4fe" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Optimal Prep</text>
    <text x="805" y="38" fill="#a855f7" font-family="sans-serif" font-size="9" text-anchor="middle">High contextual acc</text>
  </g>

  <!-- Row 4: Pipeline 4 -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="310" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="15" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">P4: Clean + Norm + Stopword</text>
    <text x="15" y="38" fill="#64748b" font-family="sans-serif" font-size="9">Remove PyThaiNLP Thai stopwords</text>

    <rect x="320" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="385" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9879</text>
    <text x="385" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 97.62%</text>

    <rect x="460" y="0" width="130" height="48" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981"/>
    <text x="525" y="24" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">F1: 0.9927 ⭐</text>
    <text x="525" y="38" fill="#10b981" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.55%</text>

    <rect x="600" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="665" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9924</text>
    <text x="665" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.50%</text>

    <rect x="740" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="805" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Context degraded</text>
    <text x="805" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Loss of relation</text>
  </g>

  <!-- Row 5 & 6: Pipeline 5 & 6 -->
  <g transform="translate(40, 366)">
    <rect x="0" y="0" width="310" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="15" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">P5/P6: + Stemming / Lemmatization</text>
    <text x="15" y="38" fill="#64748b" font-family="sans-serif" font-size="9">Morphological reduction for Thai words</text>

    <rect x="320" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="385" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9879</text>
    <text x="385" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 97.62%</text>

    <rect x="460" y="0" width="130" height="48" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981"/>
    <text x="525" y="24" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">F1: 0.9927 ⭐</text>
    <text x="525" y="38" fill="#10b981" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.55%</text>

    <rect x="600" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="665" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">F1: 0.9924</text>
    <text x="665" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Acc: 98.50%</text>

    <rect x="740" y="0" width="130" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="805" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Not needed</text>
    <text x="805" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Transformer learns</text>
  </g>

  <!-- Footer Insight Banner -->
  <g transform="translate(40, 428)">
    <rect width="870" height="52" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="20" y="22" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="700">💡 Key Research Takeaway:</text>
    <text x="20" y="39" fill="#e0e7ff" font-family="sans-serif" font-size="10">Classical ML (TF-IDF/W2V + SVM) excels on keyword-based urgent triggers, while WangchanBERTa delivers superior semantic reasoning across 17 multi-label risk nuances.</text>
  </g>
</svg>
